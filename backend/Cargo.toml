[package]
name = "prequal-backend"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "prequal-backend"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tower-http = { version = "0.6", features = ["cors"] }
