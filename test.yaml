# ============================================================
# Default Service - handles / (catch-all)
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: default-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: default
  template:
    metadata:
      labels:
        app: default
    spec:
      containers:
      - name: echo
        image: ealen/echo-server:latest
        ports:
        - containerPort: 80
        env:
        - name: PORT
          value: "80"
        - name: SERVICE_NAME
          value: "default-service"
---
apiVersion: v1
kind: Service
metadata:
  name: default-service
spec:
  selector:
    app: default
  ports:
  - port: 80
    targetPort: 80
---
# ============================================================
# Ingress with multiple paths for prefix matching tests
# ============================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: test-ingress
  labels:
    ingress.class: prequal
  annotations:
    lb/algo: round-robin
spec:
  rules:
  - host: test.example.com
    http:
      paths:
      # Order doesn't matter - radix tree finds longest prefix
      - path: /
        pathType: Prefix
        backend:
          service:
            name: default-service
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api-service
            port:
              number: 80
      - path: /api/v2
        pathType: Prefix
        backend:
          service:
            name: api-v2-service
            port:
              number: 80
      - path: /admin
        pathType: Prefix
        backend:
          service:
            name: admin-service
            port:
              number: 80
      - path: /health
        pathType: Exact
        backend:
          service:
            name: health-service
            port:
              number: 80
