# ============================================================
# API Service - handles /api (with Prequal sidecar)
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      # Main application container
      - name: echo
        image: ealen/echo-server:latest
        ports:
        - containerPort: 80
        env:
        - name: PORT
          value: "80"
        - name: SERVICE_NAME
          value: "api-service"
      # Prequal sidecar - observes connections and serves probe endpoint
      - name: prequal-sidecar
        image: prequal-sidecar:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9999
          name: probe
        env:
        - name: TARGET_PORT
          value: "80" # Port the main app listens on
        - name: PROBE_PORT
          value: "9999" # Port to serve probe endpoint
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
spec:
  selector:
    app: api
  ports:
  - name: http
    port: 80
    targetPort: 80
  - name: probe
    port: 9999
    targetPort: 9999
---
# ============================================================
# API V2 Service - handles /api/v2 (longer prefix = higher priority)
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-v2-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-v2
  template:
    metadata:
      labels:
        app: api-v2
    spec:
      containers:
      - name: echo
        image: ealen/echo-server:latest
        ports:
        - containerPort: 80
        env:
        - name: PORT
          value: "80"
        - name: SERVICE_NAME
          value: "api-v2-service"
---
apiVersion: v1
kind: Service
metadata:
  name: api-v2-service
spec:
  selector:
    app: api-v2
  ports:
  - port: 80
    targetPort: 80
---
