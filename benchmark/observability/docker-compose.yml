networks:
  benchmark:
    driver: bridge

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prequal-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=72h"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - benchmark
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    container_name: prequal-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # Wire image-renderer sidecar for server-side dashboard PNG export
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
      GF_LOG_FILTERS: rendering:debug
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - benchmark
    depends_on:
      - prometheus
      - renderer
    restart: unless-stopped

  renderer:
    image: grafana/grafana-image-renderer:3.11.6
    container_name: prequal-renderer
    environment:
      ENABLE_METRICS: "true"
    networks:
      - benchmark
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
