apiVersion: apps/v1
kind: Deployment
metadata:
  name: bench-route-a
  namespace: prequal-benchmark
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bench-route-a
  template:
    metadata:
      labels:
        app: bench-route-a
    spec:
      containers:
      - name: backend
        image: prequal-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: WORK_MULTIPLIER
          value: "1.0"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bench-route-b
  namespace: prequal-benchmark
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bench-route-b
  template:
    metadata:
      labels:
        app: bench-route-b
    spec:
      containers:
      - name: backend
        image: prequal-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: WORK_MULTIPLIER
          value: "1.0"
---
apiVersion: v1
kind: Service
metadata:
  name: bench-route-a
  namespace: prequal-benchmark
spec:
  selector:
    app: bench-route-a
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: bench-route-b
  namespace: prequal-benchmark
spec:
  selector:
    app: bench-route-b
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bench-multiroute
  namespace: prequal-benchmark
  labels:
    ingress.class: prequal
  annotations:
    lb/algo: prequal
spec:
  rules:
  - host: route-a.bench.local
    http:
      paths:
      - path: /work
        pathType: Prefix
        backend:
          service:
            name: bench-route-a
            port:
              number: 8080
  - host: route-b.bench.local
    http:
      paths:
      - path: /work
        pathType: Prefix
        backend:
          service:
            name: bench-route-b
            port:
              number: 8080
