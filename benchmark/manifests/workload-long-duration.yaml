apiVersion: apps/v1
kind: Deployment
metadata:
  name: bench-long-duration
  namespace: prequal-benchmark
spec:
  replicas: 6
  selector:
    matchLabels:
      app: bench-long-duration
  template:
    metadata:
      labels:
        app: bench-long-duration
    spec:
      containers:
      - name: backend
        image: prequal-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: WORK_MULTIPLIER
          value: "1.0"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: bench-long-duration
  namespace: prequal-benchmark
spec:
  selector:
    app: bench-long-duration
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bench-long-duration
  namespace: prequal-benchmark
  labels:
    ingress.class: prequal
  annotations:
    lb/algo: prequal
spec:
  rules:
  - host: long.bench.local
    http:
      paths:
      - path: /work
        pathType: Prefix
        backend:
          service:
            name: bench-long-duration
            port:
              number: 8080
