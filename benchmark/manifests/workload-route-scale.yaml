apiVersion: apps/v1
kind: Deployment
metadata:
  name: bench-route-scale-1
  namespace: prequal-benchmark
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bench-route-scale-1
  template:
    metadata:
      labels:
        app: bench-route-scale-1
    spec:
      containers:
      - name: backend
        image: prequal-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: WORK_MULTIPLIER
          value: "1.0"
---
