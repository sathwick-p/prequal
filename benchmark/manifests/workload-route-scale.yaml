apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bench-route-scale
  namespace: prequal-benchmark
  labels:
    ingress.class: prequal
  annotations:
    lb/algo: prequal
spec:
  rules:
  - host: route-scale-1.bench.local
    http:
      paths:
      - path: /work
        pathType: Prefix
        backend:
          service:
