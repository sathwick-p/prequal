# Fault-injection manifest: FAULT_PROBE_MODE=stale_timestamp
# prequal-backend:latest implements FAULT_PROBE_MODE natively.
# Rebuild before applying: cd backend && docker build -t prequal-backend:latest .
# Env var contract:
#   FAULT_PROBE_MODE=stale_timestamp  — probe returns valid JSON with timestamp offset into the past
#   FAULT_STALE_OFFSET_MS             — optional, milliseconds subtracted from current time (default 60000)
# The /work endpoint is unaffected.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bench-fault-stale
  namespace: prequal-benchmark
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bench-fault-stale
  template:
    metadata:
      labels:
        app: bench-fault-stale
    spec:
      containers:
      - name: backend
        image: prequal-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: WORK_MULTIPLIER
          value: "1.0"
        - name: FAULT_PROBE_MODE
          value: "stale_timestamp"
---
apiVersion: v1
kind: Service
metadata:
  name: bench-fault-stale
  namespace: prequal-benchmark
spec:
  selector:
    app: bench-fault-stale
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bench-fault-stale
  namespace: prequal-benchmark
  labels:
    ingress.class: prequal
  annotations:
    lb/algo: prequal
spec:
  rules:
  - host: fault-stale.bench.local
    http:
      paths:
      - path: /work
        pathType: Prefix
        backend:
          service:
            name: bench-fault-stale
            port:
              number: 8080
