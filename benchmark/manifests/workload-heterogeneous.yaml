# 16-backend IO-bound heterogeneous workload for the regime-pivot C2/C3 re-run.
# Requires backend with IO_BOUND_MODE support (commit TBD).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bench-fast
  namespace: prequal-benchmark
spec:
  replicas: 14
  selector:
    matchLabels:
      app: bench-fast
  template:
    metadata:
      labels:
        app: bench-fast
        app.kubernetes.io/part-of: bench-heterogeneous
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: bench-fast
      containers:
      - name: backend
        image: prequal-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: WORK_MULTIPLIER
          value: "1.0"
        - name: IO_BOUND_MODE
          value: "1"
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bench-slow
  namespace: prequal-benchmark
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bench-slow
  template:
    metadata:
      labels:
        app: bench-slow
        app.kubernetes.io/part-of: bench-heterogeneous
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: bench-slow
      containers:
      - name: backend
        image: prequal-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: WORK_MULTIPLIER
          value: "16.0"
        - name: IO_BOUND_MODE
          value: "1"
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: bench-heterogeneous
  namespace: prequal-benchmark
spec:
  selector:
    app.kubernetes.io/part-of: bench-heterogeneous
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bench-heterogeneous
  namespace: prequal-benchmark
  labels:
    ingress.class: prequal
  annotations:
    lb/algo: prequal
spec:
  rules:
  - host: bench.local
    http:
      paths:
      - path: /work
        pathType: Prefix
        backend:
          service:
            name: bench-heterogeneous
            port:
              number: 8080
