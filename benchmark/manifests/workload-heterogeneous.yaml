apiVersion: apps/v1
kind: Deployment
metadata:
  name: bench-fast
  namespace: prequal-benchmark
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bench-fast
  template:
    metadata:
      labels:
        app: bench-fast
        app.kubernetes.io/part-of: bench-heterogeneous
    spec:
      containers:
      - name: backend
        image: prequal-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: WORK_MULTIPLIER
          value: "1.0"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bench-slow
  namespace: prequal-benchmark
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bench-slow
  template:
    metadata:
      labels:
        app: bench-slow
        app.kubernetes.io/part-of: bench-heterogeneous
    spec:
      containers:
      - name: backend
        image: prequal-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: WORK_MULTIPLIER
          value: "4.0"
---
apiVersion: v1
kind: Service
metadata:
  name: bench-heterogeneous
  namespace: prequal-benchmark
spec:
  selector:
    app.kubernetes.io/part-of: bench-heterogeneous
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bench-heterogeneous
  namespace: prequal-benchmark
  labels:
    ingress.class: prequal
  annotations:
    lb/algo: prequal
spec:
  rules:
  - host: bench.local
    http:
      paths:
      - path: /work
        pathType: Prefix
        backend:
          service:
            name: bench-heterogeneous
            port:
              number: 8080
