apiVersion: v1
kind: Namespace
metadata:
  name: prequal-benchmark
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prequal-controller
  namespace: prequal-benchmark
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prequal-controller-benchmark
rules:
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prequal-controller-benchmark
subjects:
- kind: ServiceAccount
  name: prequal-controller
  namespace: prequal-benchmark
roleRef:
  kind: ClusterRole
  name: prequal-controller-benchmark
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prequal-controller
  namespace: prequal-benchmark
spec:
  replicas: 3
  selector:
    matchLabels:
      app: prequal-controller
  template:
    metadata:
      labels:
        app: prequal-controller
    spec:
      serviceAccountName: prequal-controller
      containers:
      - name: controller
        image: prequal:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: proxy
          containerPort: 8080
        - name: debug
          containerPort: 8081
        env:
        - name: PREQUAL_BENCHMARK_MODE
          value: "true"
        - name: PREQUAL_LOG_REQUESTS
          value: "false"
        - name: PREQUAL_PROBE_WORKERS
          value: "16"
        - name: PREQUAL_PROBE_QUEUE_SIZE
          value: "4096"
        - name: PREQUAL_PROBES_PER_QUERY
          value: "1.0"
        - name: PREQUAL_BACKGROUND_INTERVAL_MS
          value: "100"
        - name: PREQUAL_POOL_MAX_AGE_MS
          value: "1000"
        - name: PREQUAL_MAX_PROBE_AGE_MS
          value: "2000"
        - name: PREQUAL_POOL_MAINTENANCE_INTERVAL_MS
          value: "100"
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2"
            memory: "1Gi"
        readinessProbe:
          httpGet:
            path: /readyz
            port: debug
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: debug
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: prequal-proxy
  namespace: prequal-benchmark
spec:
  type: NodePort
  selector:
    app: prequal-controller
  ports:
  - name: proxy
    port: 8080
    targetPort: proxy
    nodePort: 31080
  - name: debug
    port: 8081
    targetPort: debug
    nodePort: 31081
