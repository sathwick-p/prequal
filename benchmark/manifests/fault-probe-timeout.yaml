# Fault-injection manifest: FAULT_PROBE_MODE=timeout
# prequal-backend:latest implements FAULT_PROBE_MODE natively.
# Rebuild before applying: cd backend && docker build -t prequal-backend:latest .
# Env var contract:
#   FAULT_PROBE_MODE=timeout  — probe handler sleeps FAULT_TIMEOUT_MS ms (default 5000) before responding
#   FAULT_TIMEOUT_MS          — optional, milliseconds to sleep (default 5000)
# The /work endpoint is unaffected.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bench-fault-timeout
  namespace: prequal-benchmark
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bench-fault-timeout
  template:
    metadata:
      labels:
        app: bench-fault-timeout
    spec:
      containers:
      - name: backend
        image: prequal-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: WORK_MULTIPLIER
          value: "1.0"
        - name: FAULT_PROBE_MODE
          value: "timeout"
---
apiVersion: v1
kind: Service
metadata:
  name: bench-fault-timeout
  namespace: prequal-benchmark
spec:
  selector:
    app: bench-fault-timeout
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bench-fault-timeout
  namespace: prequal-benchmark
  labels:
    ingress.class: prequal
  annotations:
    lb/algo: prequal
spec:
  rules:
  - host: fault-timeout.bench.local
    http:
      paths:
      - path: /work
        pathType: Prefix
        backend:
          service:
            name: bench-fault-timeout
            port:
              number: 8080
