# NGINX Ingress baseline — uniform workload
#
# Mirrors workload-uniform.yaml exactly (4 replicas, WORK_MULTIPLIER=1.0,
# prequal-backend image) with names suffixed -nginx to avoid collision with
# the prequal workload. Traffic is routed through the NGINX Ingress controller
# (ingressClassName: nginx) at host bench-nginx.local on NodePort 30180.
#
# k6 targeting:
#   TARGET_URL=http://127.0.0.1:30180/work HOST_HEADER=bench-nginx.local \
#     k6 run benchmark/k6/open_loop.js
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bench-uniform-nginx
  namespace: prequal-benchmark
spec:
  replicas: 4
  selector:
    matchLabels:
      app: bench-uniform-nginx
  template:
    metadata:
      labels:
        app: bench-uniform-nginx
    spec:
      containers:
      - name: backend
        image: prequal-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: WORK_MULTIPLIER
          value: "1.0"
---
apiVersion: v1
kind: Service
metadata:
  name: bench-uniform-nginx
  namespace: prequal-benchmark
spec:
  selector:
    app: bench-uniform-nginx
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bench-uniform-nginx
  namespace: prequal-benchmark
spec:
  ingressClassName: nginx
  rules:
  - host: bench-nginx.local
    http:
      paths:
      - path: /work
        pathType: Prefix
        backend:
          service:
            name: bench-uniform-nginx
            port:
              number: 8080
